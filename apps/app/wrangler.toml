# App Worker. Merchant dashboard and onboarding. Do not deploy.
name = "airexpay-app"
main = "src/index.ts"
compatibility_date = "2026-11-03"
workers_dev = false

# route: app.airexpay.com/*
# [[routes]]
# pattern = "app.airexpay.com/*"
# zone_name = "airexpay.com"

[vars]
ENVIRONMENT = "dev"

[env.staging]
name = "airexpay-app-staging"
workers_dev = false

# route: app-staging.airexpay.com/*
# [[env.staging.routes]]
# pattern = "app-staging.airexpay.com/*"
