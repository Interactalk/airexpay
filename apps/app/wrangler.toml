[env.production]
name = "airexpay-app"
workers_dev = false

# route: app.airexpay.com/*
# [[env.production.routes]]
# pattern = "app.airexpay.com/*"
# zone_name = "airexpay.com"

[env.production.vars]
ENVIRONMENT = "production"
